<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>counter: <span id="count">0</span></h3>
    <button onclick="counterincrement()">increment</button>
    <button onclick="counterdecrement()">decrement</button>
</body>
<script>
    var prev_count=localStorage.getItem("count");
    if (prev_count==null){
        var a=0;
    }
    else{
        document.getElementById("count").innerText=prev_count;
    }
    function counterincrement()
    {
        a++;
        document.getElementById("count").innerText=a;
        localStorage.setItem("count",a);
    }
     function counterdecrement()
    {
        a--;
        document.getElementById("count").innerText=a;
        localStorage.setItem("count",a);
    }
</script>
</html>
